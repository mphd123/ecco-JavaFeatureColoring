plugins {
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

ecco.adapter = true

javafx {
    version = "17"
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.swing']
}

dependencies {
    implementation 'com.github.javaparser:javaparser-core:3.19.0' // 3.19.0 3.25.8
    implementation project(':ecco-service')
    implementation 'org.apache.commons:commons-io:1.3.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    implementation project(':ecco-gui')
}
